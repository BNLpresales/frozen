<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brother Smooth print demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('messe.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #4D4D4D;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-sizing: border-box;
        }
        .section {
            margin-bottom: 20px;
        }
        .logo {
            width: 100%;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        .url-scheme {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Bluebar.jpg" alt="Logo" class="logo">
        <h1>Brother Smooth print demo HACCP</h1>
        <div class="section">
            <input type="text" id="customerName" placeholder="Fill in your name">
        </div>
		
		<div class="section">
            <input type="text" id="sauce" placeholder="Fill in your product">
        </div>

        <div class="section">
            <h2>Choose maximum 6 allergens</h2>
            <input type="checkbox" name="toppings" value="Celery"> Celery<br>
            <input type="checkbox" name="toppings" value="Crustaceans"> Crustaceans<br>
            <input type="checkbox" name="toppings" value="Egg"> Egg<br>
            <input type="checkbox" name="toppings" value="Fish"> Fish<br>
            <input type="checkbox" name="toppings" value="Gluten"> Gluten<br>
            <input type="checkbox" name="toppings" value="Lupin"> Lupin<br>
            <input type="checkbox" name="toppings" value="Milk"> Milk<br>
            <input type="checkbox" name="toppings" value="Molluks"> Molluks<br>
            <input type="checkbox" name="toppings" value="Mustard"> Mustard<br>
            <input type="checkbox" name="toppings" value="Nuts"> Nuts<br>
			<input type="checkbox" name="toppings" value="Peanuts"> Peanuts<br>
			<input type="checkbox" name="toppings" value="Sesame"> Sesame<br>
			<input type="checkbox" name="toppings" value="Soy"> Soy<br>
			<input type="checkbox" name="toppings" value="Sulfer dioxide"> Sulfer dioxide<br>
			<input type="checkbox" name="toppings" value="Vegan"> Vegan<br>
        </div>
		
					<!-- Here is the date-time section for .LBX name "date-time production"-->
            <label for="text3Object" id="text3Label">Date&time > production:</label><br>
            <select id="text3Object" name="text3Object">
				<--<option value="datetime-local"><p><input type='datetime-local' id='datetime-local'></p></option>
            </select>
			
			<!-- Here is the date-time section for .LBX name "date-time use before"-->	
            <label for="text4Object" id="text4Label">Date&time > use before:</label><br>
            <select id="text4Object" name="text4Object">
				<--<option value="datetime-local"><p><input type='datetime-local' id='datetime-local'></p></option>
            </select>
		
		    <label for="copies">Copies:</label>
            <input type="text" id="copies" name="copies" required><br><br>
        
		<button onclick="showSummary()">Preview Print data</button>
        <div id="summary" class="section"></div>
        
		<div class="buttons">
            <button id="printButton" style="display:none;" onclick="sendToPrint()">Print now</button>
            <button id="previewButton" style="display:none;" onclick="previewLink()">Preview Link</button>
        </div>
        
		<div id="urlScheme" class="url-scheme" style="display:none;">
            <h3>Smooth Print URL Scheme</h3>
            <p id="urlSchemeText"></p>
        </div>
    </div>
    <script>
        function showSummary() {
            const customerName = document.getElementById('customerName').value;
            const sauce = document.getElementById('sauce').value;
            const toppings = Array.from(document.querySelectorAll('input[name="toppings"]:checked')).map(el => el.value);

            if (toppings.length > 6) {
                alert("You can use maximum 6 allergens.");
                return;
            }

            const summary = `
                <h2>HACCP label</h2>
                <p><strong>Name:</strong> ${customerName}</p>
                <p><strong>Product name:</strong> ${sauce}</p>
                <p><strong>Allergens:</strong> ${toppings.join(', ')}</p>
            `;

            document.getElementById('summary').innerHTML = summary;
            document.getElementById('printButton').style.display = 'block';
            //document.getElementById('previewButton').style.display = 'block';
        }

        function sendToPrint() {
            const url = generateUrlScheme();
            window.open(url, '_blank');
            resetInputs();
        }

        function previewLink() {
            const url = generateUrlScheme();
            document.getElementById('urlSchemeText').textContent = url;
            document.getElementById('urlScheme').style.display = 'block';
        }

		function generateUrl() {
                const copies = document.getElementById('copies').value;
		}	
        
		function generateUrlScheme() {
            const customerName = document.getElementById('customerName').value;
            const sauce = document.getElementById('sauce').value;
            const toppings = Array.from(document.querySelectorAll('input[name="toppings"]:checked')).map(el => el.value).join(' <> ');
			return `brotherwebprint://print?filename=joghurt.lbx&size=58.bin&text_name=${encodeURIComponent(customerName)}&copies=${encodeURIComponent(copies)}&text_sauce=${encodeURIComponent(sauce)}&text_toppings=${encodeURIComponent(toppings)}`;
        }
		

        function resetInputs() {
            document.getElementById('customerName').value = '';
            document.getElementById('sauce').selectedIndex = '';
            document.querySelectorAll('input[name="toppings"]').forEach(checkbox => checkbox.checked = false);
            document.getElementById('summary').innerHTML = '';
            document.getElementById('printButton').style.display = 'none';
            document.getElementById('previewButton').style.display = 'none';
            document.getElementById('urlScheme').style.display = 'none';
        }

        // Limit the selection of toppings to a maximum of 3
        document.querySelectorAll('input[name="toppings"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const checkedToppings = document.querySelectorAll('input[name="toppings"]:checked');
                if (checkedToppings.length > 6) {
                    this.checked = false;
                    alert("You can use maximum 6 allergens.");
                }
            });
        });
    </script>
</body>
</html>
